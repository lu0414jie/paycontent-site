[build]
  publish = "."
  command = ""
[[redirects]]
  from = "/api/*"
  to = "https://lu0414jie.free.nf/(:splat)"  # 改为https
  status = 200
  force = true
  headers = {
    "Access-Control-Allow-Origin" = "*",
    "Access-Control-Allow-Methods" = "GET, POST, OPTIONS",
    "Access-Control-Allow-Headers" = "Content-Type"
  }


[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
