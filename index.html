<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终身会员内容站</title>
    <style>
        body { max-width: 800px; margin: 0 auto; padding: 20px; font-family: Arial, sans-serif; }
        .section { display: none; }
        .active { display: block; }
        .pay-btn { padding: 12px 24px; background: #ff4400; color: #fff; text-decoration: none; border-radius: 4px; font-size: 16px; margin-top: 20px; }
        .member-content { margin-top: 30px; padding: 20px; border: 1px solid #eee; border-radius: 4px; }
    </style>
</head>
<body>
    <!-- 1. 支付界面（非会员显示） -->
    <div id="pay-section" class="section">
        <h1>终身会员开通（<span id="price">9.90</span>元）</h1>
        <p>开通后解锁所有专属内容：军事、影视、小说等</p>
        <p>终身有效，无后续费用</p>
        <a href="https://lu0414jie.free.nf/alipay/pay.php" class="pay-btn">点击支付开通会员</a>
    </div>

    <!-- 2. 会员内容界面（会员显示） -->
    <div id="member-section" class="section">
        <h1>🎉 恭喜！你已开通终身会员</h1>
        <div class="member-content">
            <!-- 👇 替换为你的实际专属内容 -->
            <h2>专属内容区域</h2>
            <p>【军事内容】xxx...</p>
            <p>【影视资源】xxx...</p>
            <p>【小说连载】xxx...</p>
        </div>
        <p>收藏本页面，下次直接访问即可查看！</p>
    </div>

    <script>
        // 后端会员验证接口地址（无需修改，与后端路径一致）
        const API_URL = 'https://lu0414jie.free.nf/alipay/check_member.php';
        const paySection = document.getElementById('pay-section');
        const memberSection = document.getElementById('member-section');

        // 核心：验证会员状态并切换界面
        async function checkMember() {
            try {
                const res = await fetch(API_URL, {
                    method: 'GET',
                    credentials: 'include' // 关键：跨域携带Cookie/Session
                });
                const data = await res.json();
                data.is_member ? memberSection.classList.add('active') : paySection.classList.add('active');
            } catch (err) {
                paySection.classList.add('active');
            }
        }

        window.onload = checkMember;
    </script>
</body>
</html>
